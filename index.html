<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111827">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="握力トレーニング">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<title>握力トレーニング</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f4f6;color:#111827;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;-webkit-tap-highlight-color:transparent}.app{max-width:520px;min-height:100vh;margin:0 auto;background:#fff;padding:22px 16px calc(28px + env(safe-area-inset-bottom))}h1{font-size:21px;margin:4px 4px 6px}.sub{color:#6b7280;font-size:13px;margin:0 4px 20px}.hands{display:grid;grid-template-columns:1fr 1fr;gap:10px}.hand{background:#f9fafb;border-radius:20px;padding:16px 12px 14px;border:1px solid #eef0f3}.hand-title{font-size:16px;font-weight:800;text-align:center;margin-bottom:8px}.today{text-align:center;font-size:38px;font-weight:800;line-height:1.1;letter-spacing:-1.5px}.unit{text-align:center;color:#6b7280;font-size:12px;margin-bottom:12px}.buttons{display:grid;grid-template-columns:1fr 1fr;gap:7px}button{border:0;border-radius:13px;min-height:48px;font-size:16px;font-weight:750;cursor:pointer;touch-action:manipulation}.plus{background:#111827;color:#fff}.plus.secondary{background:#374151}.input-row{display:flex;gap:6px;margin-top:8px}input{width:100%;min-width:0;min-height:48px;border:2px solid #e5e7eb;border-radius:13px;padding:0 9px;font-size:17px;outline:none}input:focus{border-color:#111827}.record{background:#e5e7eb;color:#111827;padding:0 10px;white-space:nowrap;font-size:14px}.message{min-height:20px;text-align:center;color:#6b7280;font-size:12px;margin-top:7px}.stats{margin-top:14px;background:#f9fafb;border-radius:20px;padding:16px}.stats-title{font-size:14px;font-weight:800;margin-bottom:10px}.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.stat{background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:12px}.label{color:#6b7280;font-size:12px}.stat strong{display:block;font-size:22px;margin-top:4px}.streak{margin-top:10px;background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:13px;text-align:center}.streak strong{font-size:27px}.streak span{color:#6b7280;font-size:13px;margin-left:4px}.reset{width:100%;min-height:44px;background:transparent;color:#9ca3af;font-size:12px;margin-top:8px}@media(max-width:360px){.hands{gap:7px}.hand{padding:14px 9px}.today{font-size:33px}button{font-size:14px}.record{padding:0 8px}}
</style>
</head>
<body>
<div class="app">
<h1>💪 握力トレーニング</h1>
<p class="sub">右手・左手を記録。両方やった日が継続日になります。</p>
<div class="hands">
<section class="hand"><div class="hand-title">右手</div><div class="today" id="rightToday">0</div><div class="unit">回</div><div class="buttons"><button class="plus" onclick="add('right',1)">＋1</button><button class="plus secondary" onclick="add('right',10)">＋10</button></div><div class="input-row"><input id="rightInput" type="number" inputmode="numeric" min="1" placeholder="回数"><button class="record" onclick="recordInput('right')">記録</button></div><div class="message" id="rightMessage"></div></section>
<section class="hand"><div class="hand-title">左手</div><div class="today" id="leftToday">0</div><div class="unit">回</div><div class="buttons"><button class="plus" onclick="add('left',1)">＋1</button><button class="plus secondary" onclick="add('left',10)">＋10</button></div><div class="input-row"><input id="leftInput" type="number" inputmode="numeric" min="1" placeholder="回数"><button class="record" onclick="recordInput('left')">記録</button></div><div class="message" id="leftMessage"></div></section>
</div>
<section class="stats"><div class="stats-title">累計</div><div class="stat-grid"><div class="stat"><div class="label">右手</div><strong><span id="rightTotal">0</span>回</strong></div><div class="stat"><div class="label">左手</div><strong><span id="leftTotal">0</span>回</strong></div></div><div class="streak"><strong id="streak">0</strong><span>日連続</span><div class="label" style="margin-top:4px">右手・左手の両方をやった日</div></div></section>
<button class="reset" onclick="resetAll()">データをリセット</button>
</div>
<script>
const KEY="grip-training-v3";
function load(){return JSON.parse(localStorage.getItem(KEY)||'{"days":{}}')}
function save(d){localStorage.setItem(KEY,JSON.stringify(d))}
function todayKey(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`}
function add(hand,n){const d=load(),k=todayKey();if(!d.days[k])d.days[k]={right:0,left:0};d.days[k][hand]=(d.days[k][hand]||0)+n;save(d);render()}
function recordInput(hand){const i=document.getElementById(hand+"Input"),n=Number(i.value);if(!Number.isInteger(n)||n<=0){showMessage(hand,"1以上の数字を入力してください");return}add(hand,n);i.value=""}
function showMessage(hand,t){const e=document.getElementById(hand+"Message");e.textContent=t;setTimeout(()=>e.textContent="",1800)}
function calcTotal(days,hand){return Object.values(days).reduce((s,d)=>s+(d[hand]||0),0)}
function calcStreak(days){let c=0,d=new Date();while(true){const k=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`,x=days[k];if(!x||!(x.right>0&&x.left>0))break;c++;d.setDate(d.getDate()-1)}return c}
function render(){const d=load(),t=d.days[todayKey()]||{right:0,left:0};rightToday.textContent=(t.right||0).toLocaleString();leftToday.textContent=(t.left||0).toLocaleString();rightTotal.textContent=calcTotal(d.days,"right").toLocaleString();leftTotal.textContent=calcTotal(d.days,"left").toLocaleString();streak.textContent=calcStreak(d.days)}
function resetAll(){if(confirm("右手・左手の記録をすべて削除しますか？")){localStorage.removeItem(KEY);render()}}
["right","left"].forEach(h=>document.getElementById(h+"Input").addEventListener("keydown",e=>{if(e.key==="Enter")recordInput(h)}));render();
if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}))}
</script>
</body>
</html>
